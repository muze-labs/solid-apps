<section class="file-controls">
  <section class="picker-request app-card" hidden
    data-simply-field="picker" data-simply-transform="attributes"
    data-simply-attributes="hidden">
    <h2>Select a resource</h2>
    <p>Requested by <span data-simply-field="requester"
      data-simply-transform="escape_html"></span></p>
    <p>Choose a resource below. Only its URL is returned; access is unchanged.</p>
    <div class="actions">
      <button class="ds-button" data-simply-command="selectFolder">
        Select current folder</button>
      <button class="ds-button" data-simply-command="cancelSelection">
        Cancel selection</button>
    </div>
  </section>
  <form class="toolbar app-toolbar" data-simply-command="browse">
    <label
      >Folder URL<input
        name="url"
        type="url"
        required
        data-simply-field="url" /></label
    ><button class="ds-button">Open folder</button
    ><button type="button" class="ds-button" data-simply-command="up">
      Parent folder
    </button>
  </form>
  <div class="toolbar app-toolbar" data-simply-field="editing"
    data-simply-transform="attributes" data-simply-attributes="hidden">
    <form data-simply-command="mkdir">
      <label>New folder name<input name="name" required /></label
      ><button class="ds-button">Create folder</button>
    </form>
    <label class="ds-button file-upload"
      >Upload files<input
        type="file"
        multiple
        aria-label="Upload files"
        data-simply-command="upload"
    /></label>
  </div>
  <p class="muted">
    Deleted files are hidden; their contents remain in your storage.
  </p>
  <table class="file-list">
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody data-simply-list="entries">
      <template
        ><tr>
          <td>
            <button
              class="ds-button"
              data-simply-command="open"
              data-simply-value=":value.url"
            >
              <span
                data-simply-field="name"
                data-simply-transform="escape_html"
              ></span>
            </button>
          </td>
          <td data-simply-field="type" data-simply-transform="escape_html"></td>
          <td>
            <button class="ds-button" data-simply-command="selectResource"
              data-simply-value=":value.url" hidden
              data-simply-field="pick" data-simply-transform="attributes"
              data-simply-attributes="hidden">Select</button>
            <button
              class="ds-button"
              data-simply-command="remove"
              data-simply-value=":value.url"
              data-simply-field="edit" data-simply-transform="attributes"
              data-simply-attributes="hidden"
            >
              Delete
            </button>
          </td>
        </tr></template
      >
    </tbody>
  </table>
  <p
    class="empty"
    data-simply-field="empty"
    data-simply-transform="escape_html"
  ></p>
</section>
