<div style="display: contents">
  <div
    class="toolbar app-toolbar"
    data-simply-field="editing"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
  >
    <form data-simply-command="mkdir">
      <label>New folder name<input name="name" required /></label
      ><button class="ds-button">Create folder</button>
    </form>
    <label class="ds-button file-upload"
      >Upload files<input
        type="file"
        multiple
        aria-label="Upload files"
        data-simply-command="upload"
    /></label>
  </div>
</div>
