<div style="display: contents">
  <div class="app-grid">
    <article class="app-card">
      <h2>Contacts</h2>
      <p>Your address book and contact profiles</p>
      <a
        class="ds-button"
        href="../contacts/"
        target="_blank"
        rel="opener"
        data-simply-command="launchApp"
        data-simply-field="contactsLink"
        data-simply-transform="attributes"
        data-simply-attributes="href"
        >Open contacts</a
      >
    </article>
    <article class="app-card">
      <h2>Files</h2>
      <p>Browse and manage your Solid files</p>
      <a
        class="ds-button"
        href="../files/"
        target="_blank"
        rel="opener"
        data-simply-command="launchApp"
        data-simply-field="filesLink"
        data-simply-transform="attributes"
        data-simply-attributes="href"
        >Open files</a
      >
    </article>
    <article class="app-card">
      <h2>Profile</h2>
      <p>View and edit profiles</p>
      <a
        class="ds-button"
        href="../profile/"
        target="_blank"
        rel="opener"
        data-simply-command="launchApp"
        data-simply-field="profileLink"
        data-simply-transform="attributes"
        data-simply-attributes="href"
        >Open profile</a
      >
    </article>
  </div>
</div>
