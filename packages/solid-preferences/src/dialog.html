<dialog class="ds-dialog preferences-dialog">
  <form data-simply-command="save">
    <h2>Preferences</h2>
    <p data-simply-field="source" data-simply-transform="escape_html"></p>
    <div class="form-grid">
      <label
        >Theme<select name="theme" data-simply-field="theme">
          <option value="system">Browser default</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select></label
      >
      <label
        >Text size<select name="textScale" data-simply-field="textScale">
          <option>90</option>
          <option>100</option>
          <option>110</option>
          <option>120</option>
        </select></label
      >
      <label
        >Density<select name="density" data-simply-field="density">
          <option value="comfortable">Comfortable</option>
          <option value="compact">Compact</option>
        </select></label
      >
      <label
        >Preferred language<input
          name="language"
          data-simply-field="language"
          placeholder="en"
      /></label>
      <label
        >Open apps in<select name="launchTarget" data-simply-field="launchTarget">
          <option value="tab">New tabs (default)</option>
          <option value="window">New windows</option>
        </select></label
      >
    </div>
    <p class="muted">
      The interface currently uses English. Your preferred language is saved for
      all apps.
    </p>
    <fieldset>
      <legend>App storage locations</legend>
      <p>
        Leave blank to use the app default. Changing a location does not move
        existing data.
      </p>
      <label
        >Contacts Turtle resource<input
          name="contactsResource"
          type="url"
          data-simply-field="contactsResource"
      /></label>
      <label
        >Launcher Turtle resource<input
          name="launcherResource"
          type="url"
          data-simply-field="launcherResource"
      /></label>
      <label>Workspace state Turtle resource<input
        name="workspaceResource" type="url"
        data-simply-field="workspaceResource" /></label>
      <label
        >Files root container<input
          name="filesRoot"
          type="url"
          data-simply-field="filesRoot"
      /></label>
    </fieldset>
    <p
      role="status"
      data-simply-field="message"
      data-simply-transform="escape_html"
    ></p>
    <div class="actions">
      <button
        data-simply-field="buttons"
        data-simply-transform="attributes"
        data-simply-attributes="disabled"
        class="ds-button ds-button-primary"
      >
        Save preferences</button
      ><button
        data-simply-field="buttons"
        data-simply-transform="attributes"
        data-simply-attributes="disabled"
        type="button"
        class="ds-button"
        data-simply-command="close"
      >
        Cancel
      </button>
    </div>
  </form>
</dialog>
