<p class="empty" data-simply-field="empty" data-simply-transform="escape_html">
  No profile selected.
</p>
<article
  class="profile-card"
  hidden
  data-simply-field="visibility"
  data-simply-transform="attributes"
  data-simply-attributes="hidden"
>
  <section
    class="profile-details"
    data-simply-field="detailsVisibility"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
  >
    <h2 data-simply-field="title" data-simply-transform="escape_html"></h2>
    <p
      class="resource-url"
      data-simply-field="id"
      data-simply-transform="escape_html"
    ></p>
    <p
      class="muted"
      data-simply-field="sourceLabel"
      data-simply-transform="escape_html"
    ></p>
    <dl data-simply-list="details">
      <template
        ><div>
          <dt
            data-simply-field="label"
            data-simply-transform="escape_html"
          ></dt>
          <dd
            data-simply-field="value"
            data-simply-transform="escape_html"
          ></dd></div
      ></template>
    </dl>
    <p
      class="empty"
      data-simply-field="noDetails"
      data-simply-transform="escape_html"
    ></p>
    <button
      class="ds-button"
      data-simply-command="edit"
      hidden
      data-simply-field="editVisibility"
      data-simply-transform="attributes"
      data-simply-attributes="hidden"
    >
      Edit profile
    </button>
  </section>
  <form
    hidden
    data-simply-field="formVisibility"
    data-simply-transform="attributes"
    data-simply-attributes="hidden"
    data-simply-command="save"
  >
    <h2>Edit profile</h2>
    <p>
      Leave unknown details empty. Use one value per line for multiple emails,
      phone numbers or links.
    </p>
    <label
      >Name<textarea
        name="name"
        data-simply-field="name"
        data-simply-command="changed"
        rows="1"
      ></textarea></label
    ><label
      >Email addresses<textarea
        name="email"
        data-simply-field="email"
        data-simply-command="changed"
        rows="1"
      ></textarea></label
    ><label
      >Phone numbers<textarea
        name="phone"
        data-simply-field="phone"
        data-simply-command="changed"
        rows="1"
      ></textarea></label
    ><label
      >Websites<textarea
        name="website"
        data-simply-field="website"
        data-simply-command="changed"
        rows="1"
      ></textarea></label
    ><label
      >WebID / public profile URL<textarea
        name="webId"
        data-simply-field="webId"
        data-simply-command="changed"
        rows="1"
      ></textarea></label
    ><label
      >Notes<textarea
        name="notes"
        data-simply-field="notes"
        data-simply-command="changed"
        rows="4"
      ></textarea>
    </label>
    <p
      role="status"
      data-simply-field="error"
      data-simply-transform="escape_html"
    ></p>
    <div class="actions">
      <button
        class="ds-button ds-button-primary"
        data-simply-field="buttons"
        data-simply-transform="attributes"
        data-simply-attributes="disabled"
      >
        Save profile</button
      ><button
        type="button"
        class="ds-button"
        data-simply-command="cancel"
        data-simply-field="buttons"
        data-simply-transform="attributes"
        data-simply-attributes="disabled"
      >
        Cancel
      </button>
    </div>
  </form>
</article>
