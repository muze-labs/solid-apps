<details class="capability-connection app-card">
  <summary>App services connection</summary>
  <p class="muted">Connect each app using its own key from your broker operator.
    Set the capability broker URL in Preferences.</p>
  <p data-simply-field="url" data-simply-transform="escape_html"></p>
  <form class="toolbar" data-simply-command="connect">
    <label>App connection key<input type="password" name="key" required
      autocomplete="off" /></label>
    <button class="ds-button" data-simply-field="connectState"
      data-simply-transform="attributes" data-simply-attributes="disabled">
      Connect app services</button>
    <button type="button" class="ds-button" data-simply-command="disconnect">
      Disconnect app services</button>
  </form>
  <p role="status" data-simply-field="message"
    data-simply-transform="escape_html"></p>
</details>
